name: Smooth-Demon CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libdrm-dev \
            libsdbus-c++-dev \
            ocl-icd-opencl-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: |
          cmake --build build --parallel

      - name: Run software unit tests
        run: |
          ./build/tests/test_benchmark
          ./build/tests/test_cpu
          ./build/tests/test_memory
          ./build/tests/test_process
          ./build/tests/test_resource

      - name: Run environment test (hardware-dependent)
        continue-on-error: true
        run: ./build/tests/test_environment

      - name: Run temperature test (hardware-dependent)
        continue-on-error: true
        run: ./build/tests/test_temperature

      - name: Run GPU test (hardware-dependent)
        continue-on-error: true
        run: ./build/tests/test_gpu

      - name: Run system information test (environment-dependent)
        continue-on-error: true
        run: ./build/tests/test_system_info

      - name: Run capture test (Wayland/Portal-dependent)
        continue-on-error: true
        run: ./build/tests/test_capture

      - name: Verify main executable
        run: |
          test -x ./build/smoothdemon
          ./build/smoothdemon
